name: splitbind-offline

services:
  postgres:
    image: ${OFFLINE_POSTGRES_IMAGE:?OFFLINE_POSTGRES_IMAGE must be a locally loaded immutable digest}
    pull_policy: never
    environment:
      POSTGRES_DB: ${OFFLINE_POSTGRES_DB:?OFFLINE_POSTGRES_DB is required}
      POSTGRES_USER: ${OFFLINE_POSTGRES_USER:?OFFLINE_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${OFFLINE_POSTGRES_PASSWORD:?OFFLINE_POSTGRES_PASSWORD is required}
    networks: [app]
  minio:
    image: ${OFFLINE_MINIO_IMAGE:?OFFLINE_MINIO_IMAGE must be a locally loaded immutable digest}
    pull_policy: never
    command: server /data
    environment:
      MINIO_ROOT_USER: ${OFFLINE_MINIO_ROOT_USER:?OFFLINE_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${OFFLINE_MINIO_ROOT_PASSWORD:?OFFLINE_MINIO_ROOT_PASSWORD is required}
    networks: [app]
  rabbitmq:
    image: ${OFFLINE_RABBITMQ_IMAGE:?OFFLINE_RABBITMQ_IMAGE must be a locally loaded immutable digest}
    pull_policy: never
    environment:
      RABBITMQ_DEFAULT_USER: ${OFFLINE_RABBITMQ_DEFAULT_USER:?OFFLINE_RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_PASS: ${OFFLINE_RABBITMQ_DEFAULT_PASS:?OFFLINE_RABBITMQ_DEFAULT_PASS is required}
    networks: [app]
  api:
    image: ${OFFLINE_API_IMAGE:?OFFLINE_API_IMAGE must be a locally loaded immutable digest}
    pull_policy: never
    env_file: ["${API_ENV_FILE:?API_ENV_FILE is required}"]
    networks: [app]
    depends_on: [postgres, minio, rabbitmq]
  outbox:
    image: ${OFFLINE_API_IMAGE:?OFFLINE_API_IMAGE must be a locally loaded immutable digest}
    pull_policy: never
    command: ["python", "manage.py", "run_event_bridge"]
    env_file: ["${API_ENV_FILE:?API_ENV_FILE is required}"]
    networks: [app]
    depends_on: [postgres, rabbitmq]
  worker:
    image: ${OFFLINE_WORKER_IMAGE:?OFFLINE_WORKER_IMAGE must be a locally loaded immutable digest}
    pull_policy: never
    env_file: ["${WORKER_ENV_FILE:?WORKER_ENV_FILE is required}"]
    secrets: [manifest_signing_key, fingerprint_key, integrity_key]
    networks: [app]
    depends_on: [rabbitmq, minio]
  caddy:
    image: ${OFFLINE_WEB_IMAGE:?OFFLINE_WEB_IMAGE must be a locally loaded immutable digest}
    pull_policy: never
    ports: ["8080:8080"]
    environment:
      SPLITBIND_HOSTNAME: "http://:8080"
      ACME_EMAIL: "offline@example.invalid"
    networks: [app]
    depends_on: [api]

networks:
  app:
    internal: true

secrets:
  manifest_signing_key:
    file: "${MANIFEST_SIGNING_KEY_FILE:-../../artifacts/offline/keys/manifest-signing-key.pk8}"
  fingerprint_key:
    file: "${FINGERPRINT_KEY_FILE:-../../artifacts/offline/keys/fingerprint-key.bin}"
  integrity_key:
    file: "${INTEGRITY_KEY_FILE:-../../artifacts/offline/keys/integrity-key.bin}"
